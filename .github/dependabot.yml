# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
#
# github-actions keeps `uses:` SHA pins current. docker has no digest pin yet
# (floating tags intentional) but stays configured for when one's added.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  # lm-server-webapp's Python packages (images/webapp/requirements.txt, pinned).
  - package-ecosystem: "pip"
    directory: "/images/webapp"
    schedule:
      interval: "weekly"
