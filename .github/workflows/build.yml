name: Build system image
# The one system image (Containerfile) -> ghcr.io/lukemech/lm-server, then a
# GitHub release (tag + package/commit changelog, same scheme as
# immutable-sbc) and the installer ISO attached to it (build-iso.yml).
# Service images live in build-images.yml.
on:
  pull_request:
    paths-ignore: &ignored
      - "images/**"
      - "lm-server-config-secrets/**"
      - "**.md"
      - ".github/workflows/build-images.yml"
  schedule:
    - cron: "0 10 1,15 * *" # ~every 2 weeks, catches AlmaLinux updates in quiet periods
  push:
    branches-ignore:
      - "dependabot/**"
    paths-ignore: *ignored
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  IMAGE_NAME: lm-server
  DEFAULT_TAG: latest

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Did this push change the deps image (deps/, build-deps.yml)? Then it's
  # rebuilt first, in this very run (job deps), and build_push builds on it.
  # A new branch counts what it changed against the default branch.
  changes:
    name: Check for deps changes
    runs-on: ubuntu-latest
    outputs:
      deps: ${{ steps.diff.outputs.deps }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Diff deps/ against the previous push
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "${EVENT}" != "push" ]]; then
            echo "deps=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE=${BEFORE}
          if [[ -z "${BASE}" || "${BASE}" =~ ^0+$ ]] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE=$(git merge-base "origin/${DEFAULT_BRANCH}" HEAD)
          fi
          if git diff --quiet "${BASE}" HEAD -- deps .github/workflows/build-deps.yml; then
            echo "deps=false" >> "$GITHUB_OUTPUT"
          else
            echo "deps=true" >> "$GITHUB_OUTPUT"
          fi

  deps:
    name: Deps image
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-deps.yml

  build_push:
    name: Build and push image
    # After the deps image, when this push rebuilt it; right away when it
    # didn't (skipped); never on a failed one -- that would build on stale deps.
    needs: [changes, deps]
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.deps.result == 'success' || needs.deps.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      published: ${{ steps.push-image.outcome == 'success' && steps.test-mode.outputs.test_mode != 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # Same as Bluefin/Bazzite. Not needed yet -- the build fits on the stock
      # runner; uncomment if a build or rechunk runs out of disk space.
      # - name: Maximize build space
      #   uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6 # v10

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Check Just syntax
        run: just check

      - name: Prepare environment
        run: echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "$GITHUB_ENV"

      # Pushes off the default branch go to a testing-<branch> tag only --
      # never latest, never a release (same as immutable-sbc).
      - name: Compute test-branch mode
        id: test-mode
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "pull_request" \
                && "${{ github.ref }}" != "refs/heads/${{ github.event.repository.default_branch }}" ]]; then
            BRANCH_SLUG=$(printf '%s' "${{ github.ref_name }}" | tr -c 'a-zA-Z0-9' '-' | tr 'A-Z' 'a-z')
            echo "test_mode=true" >> "$GITHUB_OUTPUT"
            echo "DEFAULT_TAG=testing-${BRANCH_SLUG}" >> "$GITHUB_ENV"
          else
            echo "test_mode=false" >> "$GITHUB_OUTPUT"
          fi

      # Before the build: it pulls ghcr.io/lukemech/lm-server-deps (Containerfile).
      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The deps image to build on: this branch's own (testing-<branch>, if
      # build-deps.yml ever ran on it), else the default branch's latest.
      - name: Pick the deps image
        run: |
          set -euo pipefail
          DEPS_TAG=latest
          if [[ "${DEFAULT_TAG}" == testing-* ]] &&
            skopeo inspect --raw "docker://${IMAGE_REGISTRY}/lm-server-deps:${DEFAULT_TAG}" >/dev/null 2>&1; then
            DEPS_TAG=${DEFAULT_TAG}
          fi
          echo "deps image: lm-server-deps:${DEPS_TAG}"
          echo "DEPS_TAG=${DEPS_TAG}" >> "$GITHUB_ENV"

      - name: Build image
        run: just build "${IMAGE_NAME}" "${DEFAULT_TAG}"

      # Diff against the last release's image (not :latest, which can drift).
      - name: Check package changes
        id: check-changes
        if: github.event_name != 'pull_request' && steps.test-mode.outputs.test_mode != 'true'
        run: |
          set -euo pipefail
          PREV_TAG=$(git tag --sort=-creatordate | grep -E '^v[0-9]' | head -1 || true)
          PREV_IMAGE="${IMAGE_REGISTRY}/${IMAGE_NAME}:no-previous-release"
          if [[ -n "${PREV_TAG}" ]]; then
            while IFS= read -r CANDIDATE_SHA; do
              CANDIDATE_REF="${IMAGE_REGISTRY}/${IMAGE_NAME}:latest-${CANDIDATE_SHA}"
              if podman pull --quiet "${CANDIDATE_REF}" >/dev/null 2>&1; then
                PREV_IMAGE="${CANDIDATE_REF}"
                break
              fi
            done < <(git log --format='%h' "${PREV_TAG}")
          fi
          ./scripts/diff-packages.sh "${PREV_IMAGE}" "${IMAGE_NAME}:${DEFAULT_TAG}" \
            /tmp/package-changelog.md /tmp/package-changelog.tsv
          if grep -qx 'No package changes\.' /tmp/package-changelog.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload changelog artifact
        if: steps.check-changes.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: changelog
          path: /tmp/package-changelog.md
          retention-days: 1

      # Nothing below on a PR, or on a schedule run that found no new packages.
      - name: Rechunk with chunkah
        if: github.event_name != 'pull_request' && !(github.event_name == 'schedule' && steps.check-changes.outputs.changed == 'false')
        run: just rechunk "${IMAGE_NAME}" "${DEFAULT_TAG}"

      - name: Tag and push to GHCR
        id: push-image
        if: github.event_name != 'pull_request' && !(github.event_name == 'schedule' && steps.check-changes.outputs.changed == 'false')
        env:
          TEST_MODE: ${{ steps.test-mode.outputs.test_mode }}
        run: |
          set -euox pipefail
          for tag in $(just generate-build-tags "${DEFAULT_TAG}"); do
            if [[ "${TEST_MODE}" == "true" && "${tag}" != testing-* ]]; then continue; fi
            podman tag "${IMAGE_NAME}:${DEFAULT_TAG}" "${IMAGE_NAME}:${tag}"
            podman push --digestfile=/tmp/digestfile "${IMAGE_NAME}:${tag}" "${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}"
          done
          echo "digest=$(< /tmp/digestfile)" >> "$GITHUB_OUTPUT"

      # Required: the installed system only accepts ghcr.io/lukemech images
      # signed with the key in system_files/etc/pki/containers/ (SIGNING_SECRET
      # = the matching cosign private key, same as immutable-sbc).
      - name: Install Cosign
        if: steps.push-image.outcome == 'success'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.2"

      - name: Sign container image
        if: steps.push-image.outcome == 'success'
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          cosign sign -y --new-bundle-format=false --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"

  release-meta:
    name: Publish release
    needs: build_push
    # !cancelled(): a skipped deps job further up would skip this one too.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.build_push.result == 'success' && needs.build_push.outputs.published == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release-tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # v<almalinux major>.<date>[.N] -- AlmaLinux version read from the Containerfile.
      - name: Compute release tag
        id: release-tag
        run: |
          set -euo pipefail
          # The tag of the FROM line's image -- not what follows it ("AS base").
          ALMA_VER=$(awk '/^FROM quay.io\/almalinuxorg\/almalinux-bootc:/ { split($2, a, /[:@]/); print a[2]; exit }' Containerfile)
          [[ -n "${ALMA_VER}" ]] || { echo "no almalinux-bootc FROM line" >&2; exit 1; }
          PREFIX="v${ALMA_VER}.$(date -u +%Y%m%d)"
          if ! git rev-parse -q --verify "refs/tags/${PREFIX}" >/dev/null && [[ -z "$(git tag -l "${PREFIX}.*")" ]]; then
            TAG="${PREFIX}"
          else
            LAST_NUM=$(git tag -l "${PREFIX}.*" | sed -E "s/^${PREFIX}\.//" | sort -n | tail -1)
            TAG="${PREFIX}.$(( 10#${LAST_NUM:-0} + 1 ))"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Download changelog artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: changelog
          path: changelog-artifacts

      - name: Generate changelog
        env:
          TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ -f changelog-artifacts/package-changelog.md ]]; then
            cat changelog-artifacts/package-changelog.md > changelog.md
          else
            printf '## Notes\n\nPackage changelog missing -- see commits below.\n\n' > changelog.md
          fi
          {
            echo "## Commits"
            echo
            PREV_TAG=$(git tag --sort=-creatordate | grep -E '^v[0-9]' | head -1 || true)
            if [[ -n "${PREV_TAG}" ]]; then
              git log --pretty='- %h %s' "${PREV_TAG}..HEAD"
            else
              git log --pretty='- %h %s' -1
            fi
            ISO="lm-server-${TAG}.iso"
            README="${{ github.server_url }}/${{ github.repository }}/blob/${TAG}/README.md"
            # build-iso.yml splits an ISO of 2 GiB or more into .part-NN files.
            cat <<EOF

          ## Update an existing server

          Cockpit > **Management** > update the system image, or from a shell:
          \`sudo lm-server upgrade\` (staged, applied on the next reboot) /
          \`sudo lm-server upgrade --apply\` (download and reboot now).
          If the new image misbehaves: \`sudo lm-server rollback\`.

          ## Install a new server

          1. Download \`${ISO}\` (or its parts, see below) and \`${ISO}.sha256\`,
             write the ISO to a USB stick and boot it.
          2. The installer asks only for the system disk and the network.
          3. After the reboot, tty1 asks for the secrets repo (owner/name, branch,
             config path, GitHub user and a fine-grained token with *Contents: read-only*).
             The admin account, services and the rest come from \`lm-server.toml\`.

          Details: [First install](${README}#first-install).

          ### ISO in parts

          If the ISO is attached as \`${ISO}.part-00\`, \`.part-01\`, ... (GitHub caps
          release files at 2 GiB), download all parts and the \`.sha256\` into one folder,
          join them and check the result:

          Linux / macOS:
          \`\`\`sh
          cat ${ISO}.part-* > ${ISO}
          sha256sum -c ${ISO}.sha256      # macOS: shasum -a 256 -c ${ISO}.sha256
          \`\`\`

          Windows (cmd):
          \`\`\`bat
          copy /b ${ISO}.part-00 + ${ISO}.part-01 ${ISO}
          certutil -hashfile ${ISO} SHA256
          \`\`\`
          (add \`+ ${ISO}.part-02\` etc. if there are more parts; compare the hash with the \`.sha256\` file)
          EOF
          } >> changelog.md

      - name: Create release tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG="${{ steps.release-tag.outputs.tag }}"
          git tag -a "${TAG}" -m "${TAG}"
          git push origin "${TAG}"

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.release-tag.outputs.tag }}
          name: ${{ steps.release-tag.outputs.tag }}
          body_path: changelog.md

  build-iso:
    name: Build installer ISO
    needs: [build_push, release-meta]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.release-meta.result == 'success' }}
    uses: ./.github/workflows/build-iso.yml
    with:
      publish: true
      tag: ${{ needs.release-meta.outputs.tag }}
    permissions:
      contents: write
