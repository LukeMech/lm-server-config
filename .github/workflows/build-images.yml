name: Build service images
# Every directory under images/ is one service image:
#   images/<name>/Containerfile -> ghcr.io/lukemech/lm-server-<name>
# Pulled by the quadlets in the system image and updated on the server by
# `podman auto-update` -- independent of system releases.
on:
  pull_request:
    paths: ["images/**", ".github/workflows/build-images.yml"]
  push:
    branches-ignore: ["dependabot/**"]
    paths: ["images/**", ".github/workflows/build-images.yml"]
  schedule:
    - cron: "0 10 1,15 * *" # same as build.yml: AlmaLinux minimal / pip package updates
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover images
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: list
        run: |
          images=$(find images -mindepth 2 -maxdepth 2 -name Containerfile -printf '%h\n' | xargs -n1 basename | jq -Rsc 'split("\n") | map(select(length > 0))')
          echo "images=${images}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.image }}
    needs: discover
    strategy:
      matrix:
        image: ${{ fromJson(needs.discover.outputs.images) }}
      fail-fast: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Prepare environment
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "$GITHUB_ENV"
          echo "NAME=lm-server-${{ matrix.image }}" >> "$GITHUB_ENV"

      - name: Build image
        run: just build-image "${{ matrix.image }}" latest

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        id: push
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          set -euox pipefail
          for tag in latest "$(date +%Y%m%d)" "sha-${GITHUB_SHA::7}"; do
            podman tag "${NAME}:latest" "${NAME}:${tag}"
            podman push --digestfile=/tmp/digestfile "${NAME}:${tag}" "${IMAGE_REGISTRY}/${NAME}:${tag}"
          done
          echo "digest=$(< /tmp/digestfile)" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        if: steps.push.outcome == 'success'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.2"

      # The server's policy.json requires a signature on every ghcr.io/lukemech image.
      - name: Sign image
        if: steps.push.outcome == 'success'
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign -y --new-bundle-format=false --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY "${IMAGE_REGISTRY}/${NAME}@${DIGEST}"
