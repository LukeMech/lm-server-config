name: Build installer ISO

# Called by build.yml after a release is published, or run by hand from the
# Actions UI (then it's just a build artifact unless publish + tag are set).
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Attach the ISO to an existing release"
        type: boolean
        default: false
      tag:
        description: "Existing release tag (required if publish is checked)"
        type: string
        default: ""
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
      tag:
        type: string
        default: ""

env:
  # The payload the ISO installs, and the installer environment it boots
  # (iso/Containerfile) -- image-builder's bootc-generic-iso puts both on it.
  IMAGE: "ghcr.io/lukemech/lm-server:latest"
  INSTALLER: "ghcr.io/lukemech/lm-server-installer:latest"

concurrency:
  group: build-iso-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ISO
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      # Same as Bluefin/Bazzite: the installer container, the payload and
      # the ISO (which holds both) don't fit on the stock runner's disk.
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6 # v10

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The action pulls bootc_ref from a registry (a localhost/ image can't
      # be pulled), so the installer goes to GHCR first. Root's podman: the
      # action runs image-builder rootful, on root's container storage.
      - name: Build and push the installer container
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          echo "${GH_TOKEN}" | sudo podman login ghcr.io --username "${{ github.actor }}" --password-stdin
          sudo podman build --pull=newer --tag "${INSTALLER}" iso/
          sudo podman push "${INSTALLER}"

      - name: Build ISO
        id: build
        uses: osbuild/image-builder-action@a56f95dd77327e604a4f4d9fc06a9641313fda36 # main
        with:
          image_type: bootc-generic-iso
          bootc_ref: ${{ env.INSTALLER }}
          bootc_installer_payload_ref: ${{ env.IMAGE }}

      # GitHub release assets are capped at 2 GiB: a bigger ISO is split into
      # parts (join with `cat lm-server-*.iso.part-* > lm-server.iso`).
      - name: Prepare release files
        id: files
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # The action writes to ./output (<distro>-<type>-<arch>/...).
          ISO=$(sudo find output -iname '*.iso' -print -quit)
          [[ -n "${ISO}" ]] || { echo "no ISO produced" >&2; exit 1; }
          NAME="lm-server${TAG:+-${TAG}}.iso"
          mkdir -p dist
          sudo mv "${ISO}" "dist/${NAME}"
          sudo chown "$(id -u):$(id -g)" "dist/${NAME}"
          (cd dist && sha256sum "${NAME}" > "${NAME}.sha256")
          if (( $(stat -c %s "dist/${NAME}") > 2000000000 )); then
            (cd dist && split -b 1900M -d -a 2 "${NAME}" "${NAME}.part-" && rm -f "${NAME}")
          fi
          ls -la dist

      - name: Upload ISO artifact
        if: inputs.publish != true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lm-server-iso
          path: dist/
          retention-days: 3

      - name: Attach ISO to release
        if: inputs.publish == true
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.tag }}
          fail_on_unmatched_files: true
          files: dist/*
