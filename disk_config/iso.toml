# Anaconda installer ISO (`just build-iso`, CI: build-iso.yml).
#
# The ISO embeds the image it was built from; %post re-points the installed
# system at the registry so `bootc upgrade` / `lm-server upgrade` pull from
# GHCR -- with signature verification (policy.json + cosign key in the image).
[customizations.installer.kickstart]
contents = """
%post
bootc switch --mutate-in-place --enforce-container-sigpolicy --transport registry ghcr.io/lukemech/lm-server:latest
%end
"""

# Interactive: disk layout, network (static IP for the server), timezone and
# the first admin user (Cockpit login until the secrets repo takes over).
[customizations.installer.modules]
enable = [
  "org.fedoraproject.Anaconda.Modules.Storage",
  "org.fedoraproject.Anaconda.Modules.Network",
  "org.fedoraproject.Anaconda.Modules.Timezone",
  "org.fedoraproject.Anaconda.Modules.Users",
  "org.fedoraproject.Anaconda.Modules.Security",
]
disable = [
  "org.fedoraproject.Anaconda.Modules.Subscription",
]
