# Console shows only kernel warnings and worse. Without `quiet` on the kernel
# command line (Anaconda installs don't add it) every informational message
# lands on tty1 -- e.g. "podman1: port 1(veth1) entered forwarding state" each
# time a container starts -- right over the login prompt. Everything is still
# in `journalctl -k` / `dmesg`.
kernel.printk = 4 4 1 7
