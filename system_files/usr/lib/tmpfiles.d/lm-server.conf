# lm-server state. /var/lib/lm-server holds the GitHub token and rendered service secrets.
d /var/lib/lm-server          0700 root root -
d /var/lib/lm-server/env      0700 root root -
d /var/lib/lm-server/data     0755 root root -
# Data disk: mount it at /var/mnt/data (Cockpit > Storage). Until then it's a
# plain directory on the root filesystem. Service folders inside it are
# created by lm-server when the service is configured.
d /var/mnt/data               0755 root root -
