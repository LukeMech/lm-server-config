# lm-server state. /var/lib/lm-server holds the GitHub token and rendered service secrets.
d /var/lib/lm-server          0700 root root -
d /var/lib/lm-server/env      0700 root root -
# All service data: volumes/<service>/, on the system disk unless the
# service's `storage` in lm-server.toml bind-mounts another disk there.
d /var/lib/lm-server/volumes  0755 root root -
