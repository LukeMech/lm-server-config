# lm-server state. /var/lib/lm-server holds the GitHub token and rendered service secrets.
d /var/lib/lm-server          0700 root root -
d /var/lib/lm-server/env      0700 root root -
# All service data: volumes/<service>/, on the system disk unless the
# service's `disk`/`storage` in lm-server.toml mounts something else there.
d /var/lib/lm-server/volumes  0755 root root -

# libvirt's cache (QEMU capabilities): its SELinux label, restored at every
# boot. On bootc /var starts out as a copy of the image's, which can leave it
# mislabeled -- then virtqemud may not write there (AVC denials).
Z /var/cache/libvirt - - - -
