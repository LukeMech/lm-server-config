# / is bootc's composefs: a read-only overlay, always. Anaconda still writes a
# "/" line to /etc/fstab (on btrfs: subvol=root,compress=zstd:1), and
# remounting the overlay with those options fails ("overlay: No changes
# allowed in reconfigure") -- a failed unit at every boot for nothing, since
# the real root mount comes from the kernel command line. Skip it (shown as
# skipped, not failed) whenever / is read-only.
[Unit]
ConditionPathIsReadWrite=/
