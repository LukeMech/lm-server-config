# lm-server: the image carries the NVIDIA driver for every machine, but only
# the X99 one has the card. Without it nvidia-smi fails and the unit would
# end up failed (after 5 restarts) -- so it runs only with an NVIDIA PCI
# device (vendor 0x10de) present.
[Service]
ExecCondition=/bin/sh -c 'grep -qsx 0x10de /sys/bus/pci/devices/*/vendor'
# Containers given the card (/dev/nvidia*, labeled xserver_misc_device_t) may
# use it. Runtime only (no -P): set again at every boot, never a local change
# of the SELinux policy.
ExecStartPost=/usr/sbin/setsebool container_use_xserver_devices on
