# What `lm-server containers update` does after podman auto-update: the
# containers that follow a file upstream (image_sources.py, e.g. Immich's
# database -- after the registry updates, so it sees the versions they
# brought), then the images left unused (cleanup.py; never fails the run).
[Service]
ExecStartPost=/usr/libexec/lm-server/image_sources.py --apply
ExecStartPost=-/usr/libexec/lm-server/cleanup.py
