# Compressed swap in RAM (fedora-bootc ships zram-generator without a config,
# so it's off otherwise). Half of RAM, at most 8 GiB; zstd compresses ~3:1.
# Override on the server in /etc/systemd/zram-generator.conf.
[zram0]
zram-size = min(ram / 2, 8192)
compression-algorithm = zstd
swap-priority = 100
