<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>edit.lukemech.org</title>
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236d5dfc'/%3E%3Cpath d='M9 23l9-14 5 8-3 0 3 6z' fill='white'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #f6f6f8; --surface: #ffffff; --text: #17171c; --muted: #66667a;
      --line: #e4e4ea; --chip: #efeff4; --ok: #1f9d55; --off: #a0a0ad;
      --shadow: 0 1px 2px rgba(20, 20, 40, .06), 0 8px 24px rgba(20, 20, 40, .06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111114; --surface: #1a1a1f; --text: #ececf1; --muted: #9b9bab;
        --line: #2a2a32; --chip: #24242b; --ok: #3fcf7f; --off: #5c5c68;
        --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .25);
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg); color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 1120px; margin: 0 auto; padding: 56px 24px 72px; }
    header { margin-bottom: 16px; }
    .eyebrow { color: var(--muted); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
    h1 { font-size: clamp(32px, 5vw, 48px); line-height: 1.1; margin: 8px 0 12px; letter-spacing: -.02em; }
    header p { color: var(--muted); margin: 0; max-width: 60ch; }
    section { margin-top: 40px; }
    h2 { display: flex; align-items: baseline; gap: 12px; margin: 0 0 16px; font-size: 20px; letter-spacing: -.01em; }
    h2 small { color: var(--muted); font-size: 14px; font-weight: 400; letter-spacing: 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    a.card {
      display: flex; flex-direction: column; gap: 14px; padding: 20px;
      background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
      color: inherit; text-decoration: none; box-shadow: var(--shadow);
      transition: transform .15s ease, border-color .15s ease;
    }
    a.card:hover { transform: translateY(-2px); border-color: var(--accent); }
    a.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    a.card.off { opacity: .55; }
    .top { display: flex; align-items: center; gap: 14px; }
    .icon {
      width: 52px; height: 52px; border-radius: 12px; flex: none; overflow: hidden;
      display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 18px;
      background: var(--accent);
    }
    .icon img { width: 100%; height: 100%; display: block; }
    .name { font-weight: 650; font-size: 17px; line-height: 1.25; }
    .alt { color: var(--muted); font-size: 13px; }
    .desc { color: var(--muted); margin: 0; flex: 1; }
    .foot { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .chip { background: var(--chip); border-radius: 999px; padding: 2px 10px; color: var(--muted); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--off); }
    .ok .dot { background: var(--ok); }
    .open { margin-left: auto; font-weight: 600; color: var(--accent); }
    footer { margin-top: 56px; color: var(--muted); font-size: 13px; }
    footer a { color: inherit; }
    @media (max-width: 480px) { main { padding: 32px 16px 48px; } }
  </style>
</head>
<body>
<main>
  <header>
    <div class="eyebrow">edit.lukemech.org</div>
    <h1>Editors &amp; tools</h1>
    <p>Open-source alternatives to the usual desktop suites. The Crafting Apps run entirely in the browser: your files stay on your device.</p>
  </header>
  <div id="groups"></div>
  <footer>
    Crafting Apps by <a href="https://github.com/storytold" rel="noopener">Storytold</a> &middot;
    ConvertX by <a href="https://github.com/C4illin/ConvertX" rel="noopener">C4illin</a> &middot;
    product names are trademarks of their owners, named only for comparison.
  </footer>
</main>

<script>
  // path: where the app lives under this site. craft: a Storytold app -- its
  // container serves craft.json (version) and icon.png (from the app's repo).
  // The others are only checked for an answer.
  const GROUPS = [
    { title: "Adobe", note: "Creative Cloud alternatives", apps: [
      { path: "photo",  name: "PhotoCraft",  alt: "Adobe Photoshop",   desc: "Image editing with layers, masks, adjustments and brushes.", c: "#2f6fe4", craft: true },
      { path: "vector", name: "VectorCraft", alt: "Adobe Illustrator", desc: "Vector illustration: paths, shapes, type and artboards.",    c: "#e08a1e", craft: true },
      { path: "light",  name: "LightCraft",  alt: "Adobe Lightroom",   desc: "Photo library and raw developer.",                           c: "#12a594", craft: true },
      { path: "design", name: "DesignCraft", alt: "Adobe InDesign",    desc: "Page layout and publishing.",                                c: "#e54666", craft: true },
      { path: "film",   name: "FilmCraft",   alt: "Adobe Premiere Pro", desc: "Non-linear video editing on a timeline.",                   c: "#8e4ec6", craft: true },
      { path: "effect", name: "EffectCraft", alt: "Adobe After Effects", desc: "Motion graphics and visual effects.",                       c: "#6e56cf", craft: true },
      { path: "pdf",    name: "PdfCraft",    alt: "Adobe Acrobat",     desc: "PDF workbench: read, organize, combine, split and secure.",  c: "#e5484d", craft: true },
    ]},
    { title: "Office", note: "Microsoft 365 alternatives", apps: [
      { path: "word", name: "WordCraft", alt: "Microsoft Word",       desc: "Word processor for documents and reports.", c: "#2b5797", craft: true },
      { path: "grid", name: "GridCraft", alt: "Microsoft Excel",      desc: "Spreadsheets: formulas, tables and charts.", c: "#1e8e4f", craft: true },
      { path: "deck", name: "DeckCraft", alt: "Microsoft PowerPoint", desc: "Presentations and slide shows.",             c: "#d35230", craft: true },
    ]},
    { title: "Autodesk & Avid", note: "engineering and audio", apps: [
      { path: "cad",   name: "CADCraft",   alt: "Autodesk AutoCAD", desc: "Computer-aided design and drafting.",      c: "#c7303a", craft: true },
      { path: "sound", name: "SoundCraft", alt: "Avid Pro Tools",   desc: "Multitrack audio recording and mixing.", c: "#5b5bd6", craft: true },
    ]},
    { title: "Tools", note: "on this server", apps: [
      { path: "converter", name: "Converter", alt: "ConvertX", desc: "Convert files between formats: images, video, audio, documents and more. Files are uploaded to this server; sign-in required.", c: "#30a46c" },
    ]},
  ];

  function card(app) {
    const a = document.createElement("a");
    a.className = "card";
    a.href = `./${app.path}/`;
    a.style.setProperty("--accent", app.c);
    a.innerHTML = `
      <div class="top">
        <div class="icon" aria-hidden="true"></div>
        <div><div class="name"></div><div class="alt"></div></div>
      </div>
      <p class="desc"></p>
      <div class="foot">
        <span class="dot" aria-hidden="true"></span>
        <span class="chip status">checking&hellip;</span>
        <span class="open">Open &rarr;</span>
      </div>`;
    const icon = a.querySelector(".icon");
    icon.textContent = app.name.replace(/Craft$/, "").slice(0, 2);
    if (app.craft) {
      const img = new Image();
      img.alt = "";
      img.onload = () => icon.replaceChildren(img);
      img.src = `./${app.path}/icon.png`;
    }
    a.querySelector(".name").textContent = app.name;
    a.querySelector(".alt").textContent = app.craft ? `Alternative to ${app.alt}` : app.alt;
    a.querySelector(".desc").textContent = app.desc;
    probe(app, a);
    return a;
  }

  async function probe(app, a) {
    const status = a.querySelector(".status");
    try {
      const url = app.craft ? `./${app.path}/craft.json` : `./${app.path}/`;
      const r = await fetch(url, { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      status.textContent = app.craft ? `v${(await r.json()).version}` : "online";
      a.classList.add("ok");
    } catch {
      status.textContent = "unavailable";
      a.classList.add("off");
    }
  }

  const root = document.getElementById("groups");
  for (const g of GROUPS) {
    const s = document.createElement("section");
    const h = document.createElement("h2");
    h.textContent = g.title;
    const small = document.createElement("small");
    small.textContent = g.note;
    h.append(small);
    const grid = document.createElement("div");
    grid.className = "grid";
    grid.append(...g.apps.map(card));
    s.append(h, grid);
    root.append(s);
  }
</script>
</body>
</html>
